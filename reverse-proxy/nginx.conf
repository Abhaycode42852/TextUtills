events {}

http {
    server {
        # The reverse proxy listens on port 80 - this is the ONLY port
        # that needs to be reachable from outside Docker now. Your app
        # container will no longer publish its port directly to the host.
        listen 80;

        location / {
            # "textutils-active" is not a real hostname on the internet -
            # it only resolves because both this proxy container and the
            # app container will be placed on the same Docker network,
            # and we'll give the app container that name. Docker's
            # built-in DNS resolves container names to their internal
            # IP automatically.
            proxy_pass http://textutills-active:80;

            # These headers forward useful info about the original
            # request through to the app container (its real IP, the
            # host it asked for, etc.) - without them, the app would only
            # ever see requests as if they came from the proxy itself.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}